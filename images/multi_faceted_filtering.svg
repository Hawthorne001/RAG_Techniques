<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1295 240" style="max-width:100%;font-family:'trebuchet ms',verdana,arial,sans-serif"><defs><marker id="arrow" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="8" refY="3"><path fill="#333" d="M0,0 L0,6 L9,3 z"/></marker></defs><style>.box{fill:#ececff;stroke:#9370db;stroke-width:1.5px}.title{fill:#333;font-size:15px;font-weight:700}.sub{fill:#666;font-size:12px}.arrow{stroke:#333;stroke-width:2px;fill:none}</style><g class="boxes"><rect width="190" height="64" x="0" y="90" class="box"/><text x="95" y="118" class="title" text-anchor="middle">Vector Store Retrieval</text><text x="95" y="138" class="sub" text-anchor="middle">top-k candidates + scores</text><rect width="190" height="64" x="235" y="90" class="box"/><text x="330" y="118" class="title" text-anchor="middle">Metadata Filter</text><text x="330" y="138" class="sub" text-anchor="middle">country · company · date</text><rect width="190" height="64" x="470" y="90" class="box"/><text x="565" y="118" class="title" text-anchor="middle">Similarity Threshold</text><text x="565" y="138" class="sub" text-anchor="middle">drop low-score results</text><rect width="190" height="64" x="705" y="90" class="box"/><text x="800" y="118" class="title" text-anchor="middle">Content Filter</text><text x="800" y="138" class="sub" text-anchor="middle">required keywords</text><rect width="190" height="64" x="940" y="90" class="box"/><text x="1035" y="118" class="title" text-anchor="middle">Diversity Filter</text><text x="1035" y="138" class="sub" text-anchor="middle">remove near-duplicates</text><rect width="120" height="64" x="1175" y="90" class="box"/><text x="1235" y="118" class="title" text-anchor="middle">Filtered Context</text><text x="1235" y="138" class="sub" text-anchor="middle">clean context → LLM</text></g><g class="edges"><line x1="190" x2="225" y1="122" y2="122" marker-end="url(#arrow)" class="arrow"/><line x1="425" x2="460" y1="122" y2="122" marker-end="url(#arrow)" class="arrow"/><line x1="660" x2="695" y1="122" y2="122" marker-end="url(#arrow)" class="arrow"/><line x1="895" x2="930" y1="122" y2="122" marker-end="url(#arrow)" class="arrow"/><line x1="1130" x2="1165" y1="122" y2="122" marker-end="url(#arrow)" class="arrow"/></g><text x="647" y="205" class="sub" text-anchor="middle">Each filter removes a different kind of noise, leaving a smaller, higher-quality context for the LLM.</text></svg>